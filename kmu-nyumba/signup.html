<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landlord sign up — Nyumba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<div class="form-shell">
  <h1>List your property</h1>
  <p class="sub">Create a free landlord account to post rooms and apartments near KeMU.</p>

  <div class="form-msg" id="form-msg"></div>

  <form id="signup-form">
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" required placeholder="e.g. Mary Kinya">
    </div>
    <div class="field">
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required placeholder="07xx xxx xxx">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6">
      <div class="hint">At least 6 characters.</div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <p class="switch-link">Already have an account? <a href="login.html" style="color:var(--forest);font-weight:600">Log in</a></p>
</div>

<script type="module" src="js/auth-signup.js"></script>
</body>
</html>
