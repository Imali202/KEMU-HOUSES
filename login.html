<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landlord login — Nyumba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<div class="form-shell">
  <h1>Landlord login</h1>
  <p class="sub">Log in to post and manage your listings.</p>

  <div class="form-msg" id="form-msg"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="switch-link">New landlord? <a href="signup.html" style="color:var(--forest);font-weight:600">Create an account</a></p>
</div>

<script type="module" src="js/auth-login.js"></script>
</body>
</html>
